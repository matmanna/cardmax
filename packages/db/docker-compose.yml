name: cardmax

services:
  postgres:
    image: postgres:17-alpine
    container_name: cardmax-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cardmax
    ports:
      - "5433:5432"
    volumes:
      - cardmax_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  cardmax_postgres_data:
